name: Build Paperback Repo

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Repository
        run: |
          npm init -y
          npm install -g paperback-cli
          npm install paperback-extensions-common typescript@4.9.5
          
          # 強制以根目錄進行完整打包
          paperback bundle -b .
          
          # 建立部署目錄並處理檔案複製
          mkdir -p bundles
          touch bundles/.nojekyll
          
          # 將所有生成的檔案同步轉移到 bundles 輸出目錄
          if [ -d "v0.8" ]; then
            cp -rf v0.8/* bundles/
          fi
          if [ -d "bundles/v0.8" ]; then
            cp -rf bundles/v0.8/* bundles/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bundles
