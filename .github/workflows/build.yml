name: Build Paperback Repo

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          npm install
          npx paperback bundle
          
          mkdir -p bundles
          touch bundles/.nojekyll
          
          if [ -d "bundles/v0.8" ]; then
            cp -rf bundles/v0.8/* bundles/
          elif [ -d "v0.8" ]; then
            cp -rf v0.8/* bundles/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bundles
