name: Build Paperback Repo

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Repository
        run: |
          npm init -y
          npm install -g paperback-cli
          npm install paperback-extensions-common typescript@4.9.5
          mkdir -p temp_build bundles
          paperback bundle
          touch bundles/.nojekyll
          cp -f bundles/v0.8/versioning.json bundles/versioning.json || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bundles
