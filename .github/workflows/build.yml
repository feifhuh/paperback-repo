name: Build Paperback Repo

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Repository
        run: |
          npm init -y
          npm install -g paperback-cli
          npm install paperback-extensions-common typescript@4.9.5
          mkdir -p temp_build bundles
          paperback bundle
          touch bundles/.nojekyll
          
          # 將子目錄的清單複製到根目錄，確保 App 抓得到
          if [ -d "bundles/v0.8" ]; then
            cp -rf bundles/v0.8/* bundles/
          elif [ -d "bundles/v0.9" ]; then
            cp -rf bundles/v0.9/* bundles/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bundles
