name: Build Paperback Repo

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Extensions
        run: |
          npm init -y
          npm install -g paperback-cli
          npm install paperback-extensions-common typescript@4.9.5
          
          # 執行純粹打包，不帶非法參數
          paperback bundle
          
          # 建立輸出目錄並將生成的套件檔案複製進去
          mkdir -p bundles
          touch bundles/.nojekyll
          
          if [ -d "v0.8" ]; then
            cp -rf v0.8/* bundles/
          fi
          if [ -d "v0.9" ]; then
            cp -rf v0.9/* bundles/
          fi
          if [ -d "bundles/v0.8" ]; then
            cp -rf bundles/v0.8/* bundles/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bundles
