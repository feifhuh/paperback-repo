name: Build Paperback Repo

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Repository
        run: |
          npm init -y
          npm install -g paperback-cli@0.8.0-alpha.4
          npm install paperback-extensions-common typescript@4.9.5
          mkdir -p bundles
          
          # 直接使用內建的 CLI 打包命令
          npx paperback bundle -o bundles
          touch bundles/.nojekyll

          # 自動將 v0.8 / v0.9 目錄內容展開至根目錄
          if [ -d "bundles/v0.8" ]; then
            cp -rf bundles/v0.8/* bundles/
          elif [ -d "bundles/v0.9" ]; then
            cp -rf bundles/v0.9/* bundles/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bundles
